version: 2

seeds:
  - name: dim_filiere
    description: >
      Référentiel des filières de production : famille, caractère renouvelable
      et bas-carbone, ordre et couleur d'affichage. Source de vérité unique des
      regroupements utilisés par les tables de faits.
    config:
      column_types:
        est_renouvelable: boolean
        est_bas_carbone: boolean
        ordre_affichage: integer
    columns:
      - name: filiere
        data_tests: [unique, not_null]
      - name: famille
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [nucleaire, renouvelable, fossile]

  - name: tarifs_tempo
    description: >
      Grille réglementée de l'option Tempo (tarif bleu EDF), prix TTC du kWh par
      couleur de jour et période (hc : 22 h–6 h, hp : 6 h–22 h), puissance 6 kVA
      et plus. Validité `[date_debut, date_fin)`, `date_fin` vide pour la grille en
      vigueur. Valeurs vérifiées le 10 octobre 2026 sur les barèmes officiels HT de la
      CRE (annexe B des délibérations n° 2026-06 et n° 2026-147) : TTC = (HT + accise)
      × 1,20. À compléter à chaque mouvement tarifaire (en général 1er février et
      1er août). Hors de ces dates, les prix restent nuls dans les tables gold.
    config:
      column_types:
        date_debut: date
        date_fin: date
        prix_ttc_eur_kwh: double
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_debut, couleur, periode]
    columns:
      - name: couleur
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bleu, blanc, rouge]
      - name: periode
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hc, hp]
      - name: prix_ttc_eur_kwh
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 2

  - name: dim_region
    description: >
      Référentiel des 18 régions françaises (code INSEE, nom de référence). `est_zni` :
      zone non interconnectée au réseau métropolitain continental (Corse, outre-mer),
      où les données régionales de RTE sont absentes ou partielles.
    config:
      column_types:
        code_insee_region: varchar
        est_zni: boolean
    columns:
      - name: code_insee_region
        data_tests: [unique, not_null]
      - name: region
        data_tests: [unique, not_null]

  - name: dim_departement
    description: >
      Référentiel des 101 départements et de leur région. Avec la macro
      `code_departement`, un code commune INSEE résout toute sa hiérarchie
      (commune → département → région) sans appel réseau.
    config:
      column_types:
        code_departement: varchar
        code_insee_region: varchar
    columns:
      - name: code_departement
        data_tests: [unique, not_null]
      - name: code_insee_region
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: code_insee_region

  - name: seuils_raccordement
    description: >
      Domaine de tension et gestionnaire de réseau selon la puissance du projet,
      sur `[puissance_min_mw, puissance_max_mw)` ; `puissance_max_mw` vide pour la
      dernière tranche. Domaines de référence de l'arrêté du 17 mars 2003 ; le seuil
      structurant de 40 MW (Enedis en deçà, RTE au-delà) et la zone grise 20–40 MW
      viennent du cadrage produit du 9 octobre 2026.
    config:
      column_types:
        ordre: integer
        puissance_min_mw: double
        puissance_max_mw: double
    columns:
      - name: ordre
        data_tests: [unique, not_null]
      - name: puissance_min_mw
        data_tests: [unique, not_null]
      - name: domaine_turpe
        description: Domaine de tension de la grille TURPE (`turpe_soutirage`).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bt_inf36, bt_sup36, hta, htb1]

  - name: turpe_soutirage
    description: >
      Composante annuelle de soutirage du TURPE 7 (acheminement), validité `[date_debut,
      date_fin)`. Par domaine de tension (HTA à pointe fixe, BT > 36 kVA, HTB 1 à 3), version
      (courte, moyenne ou longue utilisation ; `unique` en HTB 3) et classe temporelle :
      `b_eur_kva_an`, coefficient de puissance souscrite (€/kVA/an, €/kW/an en HTA), et
      `c_eur_mwh`, coefficient de l'énergie (c€/kWh × 10). HTA-BT : annexe 2 de la
      délibération de la CRE n° 2026-105 du 21 mai 2026 (pages 25 à 27) ; HTB : annexe 2 de la
      délibération n° 2026-104 du même jour (tableaux 3.4 à 3.10, pages 33 à 35, en c€/kWh
      convertis ×10 ; b = 0 en HTB 3). Applicables du 1er
      août 2026 au 31 juillet 2027. Nouvelle grille chaque 1er août : clore les lignes en cours
      et ajouter les nouvelles.
    config:
      column_types:
        date_debut: date
        date_fin: date
        b_eur_kva_an: double
        c_eur_mwh: double
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_debut, domaine_turpe, utilisation, classe]
    columns:
      - name: domaine_turpe
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bt_sup36, hta, htb1, htb2, htb3]
      - name: utilisation
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [courte, moyenne, longue, unique]
      - name: classe
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pointe, hph, hch, hpb, hcb]
      - name: b_eur_kva_an
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: c_eur_mwh
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 200

  - name: turpe_gestion_comptage
    description: >
      Composantes annuelles de gestion et de comptage du TURPE 7, en €/an, même
      validité que `turpe_soutirage`. Gestion : contrat unique conclu par le fournisseur,
      terme Rf inclus (le cas d'une entreprise qui ne signe qu'avec son fournisseur) ;
      comptage : compteur communicant, relève mensuelle. HTA-BT : délibération de la CRE n° 2026-105,
      annexe 2 (pages 21 et 24) ; HTB : délibération n° 2026-104, tableaux 3.1 et 3.2 (contrat
      d'accès au réseau, comptage hebdomadaire détenu par RTE).
    config:
      column_types:
        date_debut: date
        date_fin: date
        gestion_eur_an: double
        comptage_eur_an: double
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_debut, domaine_turpe]
    columns:
      - name: domaine_turpe
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bt_sup36, hta, htb1, htb2, htb3]

  - name: limites_methodologiques
    description: >
      Pour chaque indicateur du diagnostic : sa source, sa maille, son millésime et
      ce qu'il ne dit pas. Le diagnostic affiche la limite à côté de chaque chiffre.
    columns:
      - name: indicateur
        data_tests: [unique, not_null]
      - name: limite
        data_tests: [not_null]

  - name: dim_naf2
    description: >
      Les 88 divisions de la nomenclature d'activités française NAF rév. 2 (niveau 2),
      relevées le 25 octobre 2026 sur les pages officielles de l'INSEE
      (insee.fr/fr/metadonnees/nafr2/division/<code>). Stable depuis 2008.
    config:
      column_types:
        code_naf2: varchar
    columns:
      - name: code_naf2
        data_tests:
          - unique
          - not_null
          - exact_length:
              arguments:
                length: 2
      - name: libelle_naf2
        data_tests: [not_null]

  - name: accise_electricite
    description: >
      Accise sur l'électricité en €/MWh, validité `[date_debut, date_fin)` ; le barème en
      vigueur d'une catégorie est sa ligne sans `date_fin`. `pme_haute_puissance` : tarif
      normal des PME et de la haute puissance (plus de 36 kVA), majoration ZNI comprise,
      base légale du calcul d'électro-intensité (`--va`, CIBS L312-65) ; indexé chaque
      1er février, les sorties le signalent quand un 1er février est passé depuis
      `date_debut`. Autres catégories : tarifs réduits fixés par la loi de finances
      (CIBS L312-64 et L312-65), lus dans le formulaire 2040-TIC-SD et recoupés avec le texte
      consolidé de Légifrance. Clore la ligne en cours et en ajouter une à chaque loi de
      finances.
    config:
      column_types:
        date_debut: date
        date_fin: date
        tarif_eur_mwh: double
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_debut, categorie]
    columns:
      - name: tarif_eur_mwh
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: tarifs_hphc
    description: >
      Option Heures Creuses du tarif bleu **non résidentiel**, 36 kVA, en France
      métropolitaine continentale. Prix HT du kWh par période (hp, hc) et accise sur
      l'électricité (≤ 36 kVA), validité `[date_debut, date_fin)`. Le prix payé par une
      entreprise, qui récupère la TVA, est `prix_ht + accise` (€ HTVA) ; l'abonnement 36 kVA
      HT est donné pour information. Sources officielles : barèmes de l'annexe B des
      délibérations de la CRE n° 2026-06 du 14 janvier 2026 (au 1er février 2026, page 12)
      et n° 2026-147 du 15 juillet 2026 (au 1er août 2026, page 14), entérinées par décision
      ministérielle du 29 juillet 2026 ; accise de 30,85 puis 30,62 €/MWh (loi de finances
      pour 2026). À compléter à chaque mouvement tarifaire.
    config:
      column_types:
        date_debut: date
        date_fin: date
        prix_ht_eur_kwh: double
        accise_eur_kwh: double
        abonnement_36kva_ht_eur_an: double
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_debut, periode]
    columns:
      - name: periode
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hc, hp]
      - name: prix_ht_eur_kwh
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: profils_consommation
    description: >
      Profils de consommation types : puissance appelée (kW) par plage horaire locale
      `[heure_debut, heure_fin)`, distinguant jours ouvrés et week-end.
      `puissance_flexible_kw` est la part déplaçable (recharge de véhicules, eau chaude,
      froid stockable). Profil **illustratif**, construit pour la démonstration, pas une
      courbe mesurée : environ 115 MWh par an pour un bureau de 36 kVA.
    config:
      column_types:
        heure_debut: integer
        heure_fin: integer
        puissance_kw: double
        puissance_flexible_kw: double
    data_tests:
      - unique_combination:
          arguments:
            columns: [profil, type_jour, heure_debut]
    columns:
      - name: type_jour
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ouvre, week_end]
      - name: puissance_flexible_kw
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0

  - name: dim_pays_ue
    description: >
      Les 27 pays de l'UE : code Eurostat (Grèce : EL), ISO 3166 alpha-2 (renvoyé par
      Nominatim), alpha-3 (Ember) et nom français. Relie les trois sources d'un même pays.
    columns:
      - name: code_eurostat
        data_tests: [unique, not_null]
      - name: iso2
        data_tests: [unique, not_null]
      - name: iso3
        data_tests: [unique, not_null]
  - name: tranches_eurostat
    description: >
      Tranches de consommation annuelle d'électricité des entreprises, nomenclature
      Eurostat 2007 (IA à IG), sur `[conso_min_mwh, conso_max_mwh)` ; `conso_max_mwh`
      vide pour la dernière tranche. Place une entreprise dans sa tranche à partir de sa
      consommation annuelle (`diagnose --conso`).
    config:
      column_types:
        conso_min_mwh: double
        conso_max_mwh: double
    columns:
      - name: tranche
        data_tests: [unique, not_null]
      - name: code
        data_tests: [unique, not_null]
      - name: conso_min_mwh
        data_tests: [unique, not_null]

  - name: zones_raccordement_rte
    description: >
      Zones industrielles où RTE renforce en priorité le réseau de transport pour accueillir
      de nouvelles consommations, d'après le SDDR 2025 (fiche 5) : P1, mise à disposition de
      la capacité à partir de l'année indiquée, travaux lancés dès les autorisations ; P2,
      travaux conditionnés à la concrétisation des projets industriels ; P3, exemples
      d'accélération possible cités par RTE, sans date et sous engagement financier des
      industriels. Chaque zone est repérée par la commune du poste ou du secteur cité par RTE
      (coordonnées du centre de la commune, geo.api.gouv.fr) ; « Sud Île-de-France », décrite
      par RTE comme l'Essonne et la Seine-et-Marne, a deux points (préfectures). Document daté
      de février 2025 : à mettre à jour à chaque nouvelle édition du SDDR.
    config:
      column_types:
        annee_capacite: integer
        code_insee_commune: varchar
        latitude: double
        longitude: double
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, point_reference]
    columns:
      - name: priorite
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [P1, P2, P3]
      - name: annee_capacite
        description: Nulle pour les zones P3, renseignée pour P1 et P2.
        data_tests:
          - not_null:
              config:
                where: "priorite in ('P1', 'P2')"
      - name: latitude
        data_tests:
          - accepted_range:
              arguments:
                min_value: 41
                max_value: 51.5
      - name: longitude
        data_tests:
          - accepted_range:
              arguments:
                min_value: -5.5
                max_value: 10

  - name: dim_ports_fret
    description: >
      Commune de chaque port maritime du SDES (code LOCODE), là où la carte le pose : celle des
      principaux quais (Saint-Nazaire pour Nantes Saint-Nazaire, Rémire-Montjoly pour le port
      de Dégrad des Cannes à Cayenne) ; HAROPA, publié d'un bloc, au Havre. Ports d'au moins
      0,3 Mt de marchandises en 2025 ; le test `assert_poles_fret_localises` signale un port
      qui franchirait le seuil sans commune.
    config:
      column_types:
        code_insee_commune: varchar
    columns:
      - name: locode
        data_tests: [unique, not_null]
      - name: code_insee_commune
        data_tests: [not_null]

  - name: dim_aeroports_fret
    description: >
      Commune d'implantation de chaque aéroport de la DGAC (code OACI) qui a traité au moins
      1 000 t de fret et de poste en 2025.
    config:
      column_types:
        code_insee_commune: varchar
    columns:
      - name: code_oaci
        data_tests: [unique, not_null]
      - name: code_insee_commune
        data_tests: [not_null]

  - name: sites_cles_en_main
    description: >
      Sites industriels « clés en main » de France 2030 : foncier labellisé par l'État pour
      accueillir rapidement une activité industrielle (procédures et pré-aménagement
      accompagnés). Liste de l'ANCT et de la DGE (data.gouv.fr, « Les sites clés en main -
      France 2030 », version du 19 septembre 2025, Licence Ouverte), repérée par commune ;
      coordonnées du point de la commune donné par le géocodeur de l'IGN (Géoplateforme).
      `maturite_site` est la période où le site est annoncé prêt. À mettre à jour à chaque
      nouvelle version de la liste.
    config:
      column_types:
        code_insee_commune: varchar
        code_departement: varchar
        latitude: double
        longitude: double
    columns:
      - name: id_site
        data_tests: [unique, not_null]
      - name: code_departement
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_departement')
                field: code_departement
      - name: maturite_site
        data_tests: [not_null]

  - name: facteurs_carbone_territoire
    description: >
      Intensité carbone moyenne de l'électricité consommée, en analyse de cycle de vie
      (combustion, amont, transport et distribution), par système électrique : France
      continentale, puis chaque zone non interconnectée, repérée par son code région. Facteurs
      « mix moyen, consommation » de la Base Carbone de l'ADEME (Base Empreinte), relevés le
      16 octobre 2026 sur data.ademe.fr (jeu `base-carboner`) ; `id_base_carbone` est
      l'identifiant de l'élément. Les facteurs des ZNI (éléments 24303 à 24308, validité
      décembre 2020, modifiés le 17 mai 2024) restent le dernier millésime « valide générique »
      au 25 octobre 2026 (jeu mis à jour le 3 juillet 2025) : à remplacer dès que l'ADEME en
      publie un plus récent.
    config:
      column_types:
        zone_carbone: varchar
        code_insee_region: varchar
        intensite_acv_g_co2e_kwh: double
        id_base_carbone: integer
    columns:
      - name: zone_carbone
        data_tests: [unique, not_null]
      - name: code_insee_region
        description: Vide pour la France continentale, qui regroupe les 12 régions interconnectées.
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('dim_region')
                field: code_insee_region
      - name: intensite_acv_g_co2e_kwh
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1500
