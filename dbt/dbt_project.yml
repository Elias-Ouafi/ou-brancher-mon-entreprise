# Couches silver et gold de l'architecture médaillon, construites dans DuckDB.
# La couche bronze est alimentée par le package Python `ingestion` (voir README).
name: eco2mix
version: "0.1.0"
config-version: 2
profile: eco2mix

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "logs"]

flags:
  # Pas de statistiques d'usage envoyées à dbt Labs : tout reste en local.
  send_anonymous_usage_stats: false

models:
  eco2mix:
    # Volumétrie modeste (~35 000 lignes par an et par dataset) : une
    # reconstruction complète à chaque run coûte quelques secondes et reste
    # plus simple à raisonner qu'un modèle incrémental.
    +materialized: table
    silver:
      +schema: silver
    gold:
      +schema: gold
    etoile:
      +schema: etoile

seeds:
  eco2mix:
    +schema: gold
    # Recréés à chaque run : un seed qui gagne une colonne ne bloque pas le warehouse existant
    +full_refresh: true
