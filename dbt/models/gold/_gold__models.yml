version: 2

# Couche gold : tables métier prêtes à l'emploi (dashboard, analyses).
# Unités dans le nom des colonnes : _mw (puissance), _gwh / _mwh (énergie).
models:
  - name: fct_production_filiere
    description: Production par filière au format long, au pas de mesure.
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_heure, filiere]
    columns:
      - name: filiere
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_filiere')
                field: filiere

  - name: fct_mix
    description: Mix électrique au pas de mesure, avec regroupements par famille et parts.
    columns:
      - name: date_heure
        data_tests: [unique, not_null]
      - name: part_bas_carbone
        description: Part de la production issue de filières bas-carbone (0 à 1).
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: part_renouvelable
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: fct_mix_journalier
    description: Bilan énergétique et carbone par jour civil (heure de Paris).
    columns:
      - name: jour
        data_tests: [unique, not_null]
      - name: heures_du_jour
        description: 23, 24 ou 25 selon les changements d'heure.
        data_tests:
          - accepted_values:
              arguments:
                values: [23, 24, 25]
                quote: false
      - name: est_complet
        description: Vrai si les mesures couvrent toute la journée ; sinon les totaux sont partiels.

  - name: fct_creneau_horaire
    description: >
      Une ligne par heure : intensité carbone, couleur Tempo (jour Tempo de 6 h à
      6 h), période tarifaire (hc 22 h–6 h) et prix TTC du kWh. Base des rapports
      mensuels « pics de carbone et meilleurs créneaux ».
    columns:
      - name: heure_utc
        description: Début de l'heure, en UTC (clé).
        data_tests: [unique, not_null]
      - name: periode_tarifaire
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hc, hp]
      - name: couleur_tempo
        description: Nulle si le calendrier Tempo n'a pas été chargé pour ce jour.
        data_tests:
          - accepted_values:
              arguments:
                values: [bleu, blanc, rouge]
      - name: prix_ttc_eur_kwh
        description: Nul sans couleur Tempo ou hors de la grille `tarifs_tempo`.

  - name: fct_pression_industrielle_commune
    description: >
      Consommation électrique des sites raccordés au transport, par commune, pour la
      dernière année publiée sans secret statistique. Seules les communes ayant au moins un IRIS publié y
      figurent.
    columns:
      - name: code_insee_commune
        data_tests: [unique, not_null]
      - name: est_minorant
        description: Vrai si au moins un IRIS est sous secret statistique.

  - name: fct_pression_industrielle_departement
    description: >
      Pression industrielle par département (dernière année sans secret statistique), une ligne pour
      chacun des 101 départements, rang national compris.
    columns:
      - name: code_departement
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_departement')
                field: code_departement
      - name: consommation_electricite_mwh
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: rang_national
        description: 1 = département le plus consommateur ; nul sans site raccordé.

  - name: fct_tension_reseau_region
    description: >
      Tension du réseau par région : équilibre production / consommation sur 12 mois
      glissants et contraintes d'évacuation RTE. Une ligne par région du référentiel.
    columns:
      - name: code_insee_region
        data_tests: [unique, not_null]
      - name: nb_mois
        description: Mois couverts dans la fenêtre ; 12 attendu en métropole.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 12
      - name: taux_couverture
        description: Production / consommation brute ; sous 1, la région importe.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 20
      - name: statut_equilibre
        data_tests:
          - accepted_values:
              arguments:
                values: [excedentaire, deficitaire]

  - name: fct_diagnostic_territoire
    description: >
      Diagnostic de contexte d'implantation, une ligne par département : pression
      industrielle du département et tension du réseau de sa région. La commune
      s'ajoute par jointure sur `fct_pression_industrielle_commune`.
    columns:
      - name: code_departement
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_departement')
                field: code_departement

  - name: fct_carbone_territoire
    description: >
      Intensité carbone de l'électricité et verdict « décarboné », une ligne par région :
      facteur ADEME en cycle de vie du système électrique (continent, Corse ou territoire
      d'outre-mer) comparé au seuil de 100 gCO2e/kWh de la taxonomie européenne ; intensité
      directe observée par RTE sur 12 mois en complément, pour le continent seulement.
    columns:
      - name: code_insee_region
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: code_insee_region
      - name: intensite_acv_g_co2e_kwh
        data_tests: [not_null]
      - name: est_decarbone
        description: Vrai si l'intensité en cycle de vie est sous le seuil.
        data_tests: [not_null]
      - name: intensite_directe_rte_g_co2_kwh
        description: Émissions directes de la production (RTE), hors amont et réseau ; vide en ZNI.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 200
              config:
                severity: warn

  - name: fct_cout_horaire_profil
    description: >
      Coût (€ HTVA, option Heures Creuses non résidentielle) et carbone d'un profil type,
      heure par heure. Ne dépend pas de l'adresse : prix péréqué, intensité nationale.
    data_tests:
      - unique_combination:
          arguments:
            columns: [profil, heure_utc]
    columns:
      - name: conso_kwh
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: prix_htva_eur_kwh
        description: Nul hors de la grille `tarifs_hphc`.

  - name: fct_cout_mensuel_profil
    description: >
      Bilan mensuel d'un profil type : consommation, part en heures creuses, coût HTVA,
      émissions, et gain d'un report de la part flexible vers les heures creuses.
    data_tests:
      - unique_combination:
          arguments:
            columns: [profil, mois]
    columns:
      - name: est_complet
        description: Toutes les heures du mois (heure de Paris) sont mesurées.
      - name: part_hc
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: cout_htva_eur
        description: Nul si une heure du mois est hors grille tarifaire.
      - name: gain_decalage_eur
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0

  - name: fct_prix_entreprise_eventails
    description: >
      Éventail de prix à 1, 2 et 3 ans calculé à chaque semestre d'origine, avec les
      seules données connues à cette date : central brut tiré des variations passées,
      bornes tirées des erreurs passées de la méthode. Source unique des scénarios
      affichés et du contrôle sur le passé.
    data_tests:
      - unique_combination:
          arguments:
            columns: [tranche, rang_origine, horizon_annees]
    columns:
      - name: nb_variations_observees
        data_tests:
          - accepted_range:
              arguments:
                min_value: 1

  - name: fct_prix_entreprise_backtest
    description: >
      Chaque éventail passé publiable confronté au prix moyen réellement observé sur les
      12 mois qui s'achèvent à l'horizon.
    data_tests:
      - unique_combination:
          arguments:
            columns: [tranche, rang_origine, horizon_annees]
    columns:
      - name: position
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [en_dessous, dans_eventail, au_dessus]

  - name: fct_prix_entreprise_calibration
    description: >
      Par tranche : combien de fois le prix moyen réel des 3 années suivantes est tombé
      dans l'éventail calculé au départ, au-dessus ou en dessous. Périodes chevauchantes.
    columns:
      - name: tranche
        data_tests: [unique, not_null]
      - name: nb_periodes_controlees
        description: >
          Égal à `nb_dans_eventail + nb_au_dessus + nb_en_dessous` (test
          `assert_calibration_prix_complete`).

  - name: fct_prix_entreprise_scenarios
    description: >
      Scénarios d'évolution du prix d'une tranche à 1, 2 et 3 ans : central brut tiré des
      variations passées, corrigé par le 10e centile, la médiane et le 90e centile des
      erreurs passées de la méthode. Pas une prévision.
    data_tests:
      - unique_combination:
          arguments:
            columns: [tranche, horizon_annees]
    columns:
      - name: variation_centrale
        data_tests: [not_null]
      - name: nb_erreurs_observees
        description: >
          Nombre d'erreurs passées qui calibrent l'éventail. En dessous de 10 (variable
          dbt `prix_nb_erreurs_min`), les prix restent nuls et la tranche n'a pas de
          scénario.

  - name: fct_prix_entreprise_tranche
    description: >
      Prix de l'électricité d'une entreprise selon sa tranche de consommation annuelle :
      prix des 12 derniers mois, repères historiques et prix moyen des 3 prochaines années
      par scénario. National : ne dépend pas de l'adresse.
    columns:
      - name: tranche
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('tranches_eurostat')
                field: tranche
      - name: prix_reference_eur_kwh
        data_tests: [not_null]
      - name: prix_3_ans_central_eur_kwh
        description: >
          Le scénario central est encadré par les scénarios bas et haut (test
          `assert_scenarios_prix_ordonnes`).

  - name: fct_contraintes_departement
    description: >
      Contraintes prospectives du réseau de transport rattachées à un département par
      leurs postes : une ligne par département et par contrainte.
    data_tests:
      - unique_combination:
          arguments:
            columns: [code_departement, ouvrage, poste_1, poste_2, poste_3]
    columns:
      - name: code_departement
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_departement')
                field: code_departement

  - name: fct_postes_rte_departement
    description: >
      Postes RTE en exploitation par département et par domaine de tension, et postes
      en projet. Un repère de densité du réseau, pas une capacité de raccordement.
    columns:
      - name: code_departement
        data_tests: [unique, not_null]
