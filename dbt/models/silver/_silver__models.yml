version: 2

# Couche silver : données nettoyées, typées et conformes, sans règle métier.
# Une ligne = une mesure réelle ; la qualité et le pas de temps sont explicites.
models:
  - name: ventes_locaux
    description: >
      Ventes de locaux d'activité seuls, avec prix au m² ; les arrondissements de Paris, Lyon et
      Marseille sont ramenés à leur commune.
    columns:
      - name: id_mutation
        data_tests: [unique, not_null]
      - name: prix_m2
        data_tests: [not_null]
  - name: ecowatt_jours
    description: Signal Ecowatt de chaque jour relevé, nommé vert, orange ou rouge.
    columns:
      - name: jour
        data_tests: [unique, not_null]
      - name: niveau
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [vert, orange, rouge]
  - name: profils_charge_sup36
    description: Demi-heures dont la courbe n'est pas masquée par le secret statistique, en kW.
    columns:
      - name: puissance_moyenne_kw
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
  - name: national_tr
    description: Temps réel nettoyé (lignes « à blanc » écartées), pas de 15 min.
    columns:
      - name: date_heure
        description: Début du quart d'heure mesuré, en UTC.
        data_tests: [unique, not_null]
      - name: qualite
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [temps_reel]
      - name: consommation
        description: Consommation nationale, MW.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 15000
                max_value: 110000
              config:
                severity: warn
      - name: taux_co2
        description: Intensité carbone de la production, gCO₂/kWh.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 250
              config:
                severity: warn

  - name: national_cons_def
    description: Consolidé/définitif nettoyé (demi-heures mesurées uniquement), pas de 30 min.
    columns:
      - name: date_heure
        description: Début de la demi-heure mesurée, en UTC.
        data_tests: [unique, not_null]
      - name: qualite
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [consolidee, definitive]
      - name: consommation
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 15000
                max_value: 110000
              config:
                severity: warn

  - name: mix_unifie
    description: >
      Série unique, consolidé/définitif puis temps réel au-delà de la dernière
      mesure consolidée. Le pas varie (30 puis 15 min) et est porté par `pas_minutes`.
    columns:
      - name: date_heure
        data_tests: [unique, not_null]
      - name: qualite
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [temps_reel, consolidee, definitive]
      - name: pas_minutes
        description: Durée couverte par la mesure, en minutes (15 ou 30).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [15, 30]
                quote: false

  - name: tempo_jours
    description: Calendrier Tempo, une ligne par jour Tempo (de 6 h à 6 h le lendemain).
    columns:
      - name: jour_tempo
        description: Jour civil (heure de Paris) dont la couleur commence à 6 h.
        data_tests: [unique, not_null]
      - name: couleur
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bleu, blanc, rouge]

  - name: conso_entreprises_adresse
    description: >
      Consommation annuelle d'électricité des entreprises raccordées à Enedis, une ligne
      par adresse et secteur, avec l'adresse normalisée (sans accent, casse ni ponctuation)
      qui sert à la rapprocher de l'adresse géocodée par la BAN. Hiérarchie commune →
      département → région résolue localement.
    data_tests:
      - unique_combination:
          arguments:
            columns: [annee, code_insee_commune, tri_des_adresses]
    columns:
      - name: annee
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 2018
                max_value: 2030
      - name: code_iris
        data_tests:
          - not_null
          - exact_length:
              arguments:
                length: 9
      - name: code_departement
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_departement')
                field: code_departement
      - name: code_naf2
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_naf2')
                field: code_naf2
      - name: consommation_mwh
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0

  - name: conso_industrielle_iris
    description: >
      Consommation électrique annuelle des sites raccordés au transport, par IRIS,
      code IRIS complété sur 9 caractères et commune reconstituée quand ODRÉ ne la
      publie pas. Hiérarchie commune → département → région résolue localement.
    data_tests:
      - unique_combination:
          arguments:
            columns: [annee, code_iris]
    columns:
      - name: annee
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 2011
                max_value: 2030
      - name: code_iris
        data_tests:
          - not_null
          - exact_length:
              arguments:
                length: 9
      - name: code_insee_commune
        data_tests: [not_null]
      - name: code_departement
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_departement')
                field: code_departement
      - name: code_insee_region
        description: Issu du référentiel `dim_departement`, jamais du libellé publié.
        data_tests: [not_null]
      - name: consommation_electricite_mwh
        description: MWh par an. Nulle = secret statistique (voir `est_secret`).
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0

  - name: equilibre_regional_mensuel
    description: Équilibre production / consommation brute par région et par mois, en MWh.
    data_tests:
      - unique_combination:
          arguments:
            columns: [mois, code_insee_region]
    columns:
      - name: mois
        description: Premier jour du mois.
        data_tests: [not_null]
      - name: code_insee_region
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: code_insee_region
      - name: consommation_brute_mwh
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0

  - name: contraintes_reseau_region
    description: >
      Contraintes d'évacuation du réseau de transport par région, code INSEE retrouvé
      depuis le libellé publié en majuscules.
    columns:
      - name: code_insee_region
        description: Nul si le libellé publié n'a pas été reconnu — le test l'interdit.
        data_tests: [unique, not_null]

  - name: prix_entreprises
    description: >
      Prix semestriel de l'électricité des entreprises (Eurostat `nrg_pc_205`), une
      ligne par semestre et par tranche, hors taxes et hors TVA côte à côte.
    data_tests:
      - unique_combination:
          arguments:
            columns: [semestre, tranche]
    columns:
      - name: rang_semestre
        description: Numéro continu du semestre (`annee * 2 + numero - 1`).
        data_tests: [not_null]
      - name: numero_semestre
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: prix_htva_eur_kwh
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: taxes_non_recuperables_eur_kwh
        description: Écart entre le prix hors TVA et le prix hors taxes (accise, CTA…).
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0

  - name: postes_rte
    description: >
      Postes électriques RTE, code de département retrouvé depuis le nom publié, domaine
      de tension (HTB1 ≤ 150 kV, HTB2 225 kV, HTB3 400 kV).
    columns:
      - name: code_poste
        data_tests: [unique, not_null]
      - name: code_departement
        description: Nul si la source ne publie pas de département ; jamais si elle en publie un.
        data_tests:
          - not_null:
              config:
                where: "departement_publie is not null"
          - relationships:
              arguments:
                to: ref('dim_departement')
                field: code_departement
      - name: domaine_tension
        data_tests:
          - accepted_values:
              arguments:
                values: [HTB1, HTB2, HTB3]

  - name: contraintes_ouvrages
    description: >
      Contraintes résiduelles prospectives sur le réseau de transport, classes de
      fréquence et de pérennité ordonnées, code de région retrouvé depuis le libellé.
    data_tests:
      - unique_combination:
          arguments:
            columns: [ouvrage, poste_1, poste_2, poste_3]
    columns:
      - name: code_insee_region
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: code_insee_region
      - name: rang_occurrence
        description: 1 (très faible, jusqu'à 5 fois par an) à 5 (très forte, plus de 150 fois).
        data_tests: [not_null]
      - name: rang_perennite
        data_tests: [not_null]
