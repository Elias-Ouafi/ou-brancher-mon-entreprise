version: 2

# Couche bronze : alimentée par le package Python `ingestion`, pas par dbt.
# Une table par dataset ODRÉ, miroir fidèle de la source : mêmes colonnes,
# dernière version publiée de chaque pas de temps (MERGE sur `date_heure`).
# L'historique complet des révisions reste dans les Parquet de `data/bronze/`.
sources:
  - name: bronze
    schema: bronze
    description: Données éCO2mix telles que publiées par l'API ODRÉ, normalisées en UTC.
    tables:
      - name: national_tr
        description: >
          éCO2mix national temps réel (pas 15 min), chargé toutes les heures.
          La ligne la plus récente est souvent publiée « à blanc » (mesures nulles).
        columns:
          - name: date_heure
            data_tests: [unique, not_null]
      - name: national_cons_def
        description: >
          éCO2mix national consolidé puis définitif, rechargé tous les mois.
          Une ligne par quart d'heure, mais mesures renseignées à la demi-heure seulement.
        columns:
          - name: date_heure
            data_tests: [unique, not_null]
      - name: rte_tempo
        description: >
          Calendrier Tempo publié par l'API RTE « Tempo Like Supply Contract » :
          une ligne par jour civil, `date_heure` = minuit heure de Paris, `couleur`
          parmi BLUE, WHITE, RED. Alimenté à la demande par la commande `tempo`.
        columns:
          - name: date_heure
            data_tests: [unique, not_null]
      - name: consommation_annuelle_par_iris
        description: >
          Consommation annuelle d'électricité et de gaz des sites industriels raccordés
          aux réseaux de transport, à la maille IRIS, de 2012 à 2023. Pièce maîtresse du
          diagnostic : porte `code_insee_commune`, clé de jointure avec le géocodage BAN.
          Trois caractéristiques à connaître. `code_insee_commune` est nul sur environ
          2,7 % des lignes (484 sur 17 656), qui ne sont donc pas localisables. Le jeu ne
          couvre que 1 523 communes : l'immense majorité des communes françaises n'a aucun
          site industriel raccordé au transport, et c'est une information en soi. Enfin
          ODRÉ publie 233 clés en doublon dont une ligne est quasi vide ; le MERGE retient
          la plus complète.
        data_tests:
          - unique_combination:
              arguments:
                columns: [annee, code_iris]
        columns:
          - name: annee
            description: Année de référence, telle que publiée (« 2023 »).
            data_tests: [not_null]
          - name: code_iris
            data_tests: [not_null]
      - name: equilibre_regional_mensuel_prod_conso_brute
        description: >
          Équilibre mensuel production / consommation brute par région, de janvier 2014 à
          décembre 2025, pour les 13 régions métropolitaines. Le solde
          `consommation_brute - production_totale` donne le déficit régional, premier
          indicateur de tension du réseau.
        data_tests:
          - unique_combination:
              arguments:
                columns: [mois, code_insee_region]
        columns:
          - name: mois
            description: Mois de référence, tel que publié (« 2025-12 »).
            data_tests: [not_null]
          - name: code_insee_region
            data_tests: [not_null]
      - name: energies_et_puissances_regionales_liees_au_contraintes
        description: >
          Puissance EnR installée, puissance à compenser et énergie non évacuée par saison,
          pour 12 régions. Instantané sans dimension temporelle (vision décembre 2024) :
          il décrit la contrainte structurelle du réseau régional, pas une série.
          Attention, la clé est le **libellé** de région en majuscules (« GRAND EST »), pas
          un code INSEE : la jointure passe par une normalisation.
        columns:
          - name: region
            data_tests: [unique, not_null]
      - name: eurostat_nrg_pc_205
        description: >
          Prix semestriels de l'électricité des entreprises en France (Eurostat
          `nrg_pc_205`), par tranche de consommation annuelle IA à IG, depuis 2007.
          Deux niveaux de fiscalité : `X_TAX` (hors taxes) et `X_VAT` (hors TVA et taxes
          récupérables, le prix réellement payé par une entreprise). Moyennes pondérées
          déclarées par les fournisseurs : un prix de marché constaté, pas un tarif.
        data_tests:
          - unique_combination:
              arguments:
                columns: [semestre, tranche, fiscalite]
        columns:
          - name: semestre
            description: Semestre tel que publié (« 2026-S1 »).
            data_tests: [not_null]
          - name: tranche
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('tranches_eurostat')
                    field: tranche
          - name: fiscalite
            data_tests:
              - accepted_values:
                  arguments:
                    values: [X_TAX, X_VAT]
      - name: contraintes_region
        description: >
          Contraintes résiduelles prospectives (horizon 3 à 5 ans) sur le réseau de
          transport, ouvrage par ouvrage (ODRÉ `contraintes-region`, vision décembre 2024).
          Les champs géographiques de la source sont vides : une contrainte se localise par
          ses postes. Un même ouvrage peut porter plusieurs contraintes ; `poste_2` et
          `poste_3` valent la chaîne vide quand ils sont absents.
        data_tests:
          - unique_combination:
              arguments:
                columns: [ouvrage, poste_1, poste_2, poste_3]
        columns:
          - name: ouvrage
            data_tests: [not_null]
      - name: postes_electriques_rte
        description: >
          Postes électriques RTE et points de piquage (ODRÉ `postes-electriques-rte`) :
          tension, état et nom du département, sans coordonnées.
        columns:
          - name: code_poste
            data_tests: [unique, not_null]
      - name: eurostat_nrg_pc_205_ue
        description: >
          Prix semestriels de l'électricité des entreprises dans les 27 pays de l'UE (Eurostat
          `nrg_pc_205`), mêmes tranches et fiscalités que le jeu France, depuis 2024. `pays` est
          le code Eurostat (Grèce : EL).
        data_tests:
          - unique_combination:
              arguments:
                columns: [pays, semestre, tranche, fiscalite]
        columns:
          - name: pays
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('dim_pays_ue')
                    field: code_eurostat
      - name: ember_intensite_carbone
        description: >
          Intensité carbone annuelle de la production électrique des pays de l'UE, en cycle de
          vie (gCO₂e/kWh), ligne « Total generation » du fichier européen d'Ember (CC BY 4.0).
          Production du pays seulement : les échanges aux frontières n'y sont pas.
        data_tests:
          - unique_combination:
              arguments:
                columns: [iso3, annee]
        columns:
          - name: iso3
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('dim_pays_ue')
                    field: iso3
      - name: edf_sei_production
        description: >
          Production horaire par filière en Corse, Guadeloupe, Martinique, Guyane et à La
          Réunion (EDF SEI, licence ouverte), en MW moyens, imports compris dans la production
          totale. Les années récentes sont « Estimé » avant validation ; Mayotte est absente.
        data_tests:
          - unique_combination:
              arguments:
                columns: [territoire, date_heure]
        columns:
          - name: territoire
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [Corse, Guadeloupe, Martinique, Guyane, Réunion]
          - name: date_heure
            data_tests: [not_null]
      - name: gaspar_plans
        description: >
          Plans de prévention des risques naturels, technologiques et miniers par commune
          (export GASPAR, fichiers `pprn`, `pprt` et `pprm`) : une ligne par commune, procédure
          et aléa. `etat` vaut « Opposable », « Prescrit » ou « Caduque » ; `millesime` est la
          date du fichier, propre à chaque type de plan.
        data_tests:
          - unique_combination:
              arguments:
                columns: [code_commune, code_procedure, code_risque]
        columns:
          - name: code_commune
            data_tests: [not_null]
          - name: type_plan
            data_tests:
              - accepted_values:
                  arguments:
                    values: [PPRN, PPRT, PPRM]
          - name: millesime
            data_tests: [not_null]
      - name: gaspar_risques
        description: >
          Risques majeurs recensés par commune, d'après les dossiers départementaux des
          risques majeurs (export GASPAR de Géorisques, fichier `ddrm_risq_gaspar`).
          `num_risque` est hiérarchique : « 11 » (inondation) se précise en « 112 » (crue à
          débordement lent). `millesime` est la date du fichier : un risque retiré de la
          source garde l'ancienne date, le silver ne retient que la dernière.
        data_tests:
          - unique_combination:
              arguments:
                columns: [code_commune, num_risque]
        columns:
          - name: code_commune
            data_tests: [not_null]
          - name: millesime
            data_tests: [not_null]
      - name: sites_production
        description: >
          Puissance de production en service par commune d'implantation et filière, d'après le
          registre national des installations (ODRÉ), agrégée à la source : seules les
          installations d'au moins 10 MW y figurent. Puissance en MW, énergie annuelle glissante
          produite en GWh.
        data_tests:
          - unique_combination:
              arguments:
                columns: [code_commune, commune, filiere]
        columns:
          - name: filiere
            data_tests: [not_null]
      - name: communes_centres
        description: >
          Centre géographique de chaque commune (geo.api.gouv.fr, Etalab) : sert à poser les
          pôles de production sur la carte, à la maille commune.
        columns:
          - name: code_commune
            data_tests: [not_null, unique]
