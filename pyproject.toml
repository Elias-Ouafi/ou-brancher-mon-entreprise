[project]
name = "ou-brancher-mon-entreprise"
version = "0.2.0"
description = "Diagnostic d'implantation electrique par adresse : reseau, prix et risques, d'apres les donnees publiques (RTE, ODRE, Eurostat, Georisques)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyarrow>=16.0",
    "pyspark>=4.0,<5",
    "duckdb>=1.0",
    # requis par le client Python DuckDB pour rendre les TIMESTAMPTZ
    "pytz>=2024.1",
    "pydantic-settings>=2.2",
    # zoneinfo n'a pas de base de fuseaux sur Windows ni dans les images slim
    "tzdata>=2024.1",
]

[project.scripts]
ou-brancher = "ingestion.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]
# Silver et gold ; >= 1.10 pour la syntaxe `arguments:` des tests de données
dbt = [
    "dbt-duckdb>=1.10,<2",
]
# Rapports PDF et graphiques
report = [
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "reporting"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
# Typographie française des rapports (« 6 h–22 h »)
allowed-confusables = ["–"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:PySpark does not yet fully support pandas:FutureWarning"]

# Mesurée par `pytest --cov` (CI et verifier.py) ; les tests eux-mêmes ne comptent pas
[tool.coverage.run]
source = ["ingestion", "reporting"]
omit = ["ingestion/tests/*"]
branch = true

[tool.coverage.report]
# Relevé du 9 novembre 2026 : 92,5 % sous Windows ; marge pour la CI sous Ubuntu, pas encore mesurée
fail_under = 91
show_missing = true
skip_covered = true
