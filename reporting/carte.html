<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Atlas électrique de France</title>

<style>
/* Plein écran : carte 3D au fond, adresse en haut, verdict ou fiche en bas à gauche, lentilles en bas à droite */
:root {
  --ink: #0d1a26;
  --panel: #142334;
  --panel-2: #1c3047;
  --gold: #d6b26a;
  --gold-dim: #8a7145;
  --parch: #efe4c8;
  --parch-dim: #b9ad90;
  --good: #6fbf73;
  --warn: #e3b341;
  --bad: #d9573f;
  --f-display: "Trajan Pro", "Palatino Linotype", Georgia, serif;
  --f-body: "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--parch); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; touch-action: none; }
.vignette { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, transparent 55%, color-mix(in srgb, var(--ink) 85%, transparent) 100%); }
.frame { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--gold-dim);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 18%, transparent), 0 8px 28px color-mix(in srgb, var(--ink) 70%, transparent); }
button { font: inherit; }

.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 18px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  border-width: 0 0 1px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.brand { font-family: var(--f-display); font-weight: 700; letter-spacing: .08em; color: var(--gold); font-size: 15px; text-transform: uppercase; }
.res { overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.sep { width: 1px; height: 22px; background: var(--gold-dim); opacity: .6; flex: none; }
.chip { margin-left: auto; font-size: 12px; color: var(--parch-dim); border: 1px solid var(--gold-dim); padding: 2px 8px; border-radius: 10px; }

.city { position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 340px; max-width: calc(100vw - 32px); border-radius: 4px; overflow: hidden; }
.city header { padding: 10px 14px 9px; border-bottom: 1px solid var(--gold-dim); position: relative;
  background: linear-gradient(90deg, color-mix(in srgb, var(--rc, var(--gold)) 55%, var(--panel)), var(--panel-2)); }
.city h2 { margin: 0; font-family: var(--f-display); font-size: 20px; letter-spacing: .04em; text-wrap: balance; padding-right: 24px; }
.city .sub { font-size: 13px; opacity: .85; }
.city .close { position: absolute; right: 8px; top: 8px; background: none; border: 0; color: var(--parch); font-size: 18px; cursor: pointer; line-height: 1; padding: 4px; }
.city .vide { padding: 14px; color: var(--parch-dim); font-size: 14px; line-height: 1.4; }
.yields { display: grid; gap: 1px; background: color-mix(in srgb, var(--gold) 14%, transparent); }
.y { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; padding: 7px 14px; background: var(--panel); }
.y svg { width: 20px; height: 20px; }
.y .k { font-size: 13.5px; color: var(--parch-dim); }
.y .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.y .v small { font-weight: 400; color: var(--parch-dim); }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 9px; margin-left: 6px; }
.pill.good { background: color-mix(in srgb, var(--good) 25%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 25%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.pill.neutre { background: color-mix(in srgb, var(--parch-dim) 20%, transparent); color: var(--parch-dim); }
.verdict { padding: 10px 14px; font-size: 14px; line-height: 1.4; background: var(--panel); }
.critere { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 7px 14px; background: var(--panel); }
.critere .k { font-size: 13.5px; color: var(--parch-dim); }
.critere .v { font-weight: 700; text-align: right; }
.critere .d { grid-column: 1 / -1; font-size: 12.5px; color: var(--parch-dim); line-height: 1.35; }
.limit { padding: 8px 14px 10px; font-size: 12.5px; color: var(--parch-dim); background: var(--ink); border-top: 1px solid var(--gold-dim); }
.limit b { color: var(--gold); font-weight: 500; }

.lenses { position: fixed; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.vues { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 300px; }
.vues button { background: var(--panel); color: var(--parch); border: 1px solid var(--gold-dim); border-radius: 12px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.vues button:hover, .vues button:focus-visible { border-color: var(--gold); outline: none; }
.vues button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.legend { width: 280px; max-width: calc(100vw - 32px); padding: 10px 12px; border-radius: 4px; font-size: 12.5px; color: var(--parch-dim); }
.legend h3 { margin: 0 0 6px; font-family: var(--f-display); font-size: 13px; letter-spacing: .08em; color: var(--gold); text-transform: uppercase; }
.legend .bar { height: 10px; border-radius: 2px; margin: 4px 0 3px; border: 1px solid var(--gold-dim); }
.legend .ticks { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; color: var(--parch); }
.legend p { margin: 6px 0 0; line-height: 1.35; }
.legend .filieres { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin-top: 4px; color: var(--parch); font-variant-numeric: tabular-nums; }
.legend * + h3 { margin-top: 10px; }
.legend .teintes { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--parch); }
.legend .teintes i, .legend .filieres i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; border: 1px solid var(--ink); }
.banner.prod { border-color: var(--gold-dim); font-size: 11.5px; padding: 1px 8px; }
.lensbar { display: flex; gap: 8px; }
.lens { width: 58px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; cursor: pointer; color: var(--parch-dim); font: 500 11.5px var(--f-body); }
.lens .disc { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, var(--panel-2), var(--ink)); border: 2px solid var(--gold-dim); transition: border-color .2s, transform .2s; }
.lens svg { width: 24px; height: 24px; }
.lens:hover .disc { transform: translateY(-2px); }
.lens[aria-pressed="true"] { color: var(--gold); }
.lens[aria-pressed="true"] .disc { border-color: var(--gold); box-shadow: 0 0 14px color-mix(in srgb, var(--gold) 55%, transparent); }
.lens:focus-visible { outline: none; }
.lens:focus-visible .disc { outline: 2px solid var(--parch); outline-offset: 2px; }

#labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.rlabel { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .22em;
  text-transform: uppercase; color: var(--parch); text-align: center; line-height: 1.15; text-shadow: 0 1px 3px var(--ink), 0 0 10px var(--ink); opacity: .9; width: max-content; max-width: 170px; }
.rlabel small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11px; letter-spacing: .04em; text-transform: none; color: var(--parch-dim); }
.banner { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 6px; padding: 2px 9px 2px 2px; border-radius: 14px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--gold); font-size: 12.5px; white-space: nowrap; }
.banner .pr { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 11px; color: var(--ink); background: var(--gold); }
.banner.p2 .pr { background: var(--parch-dim); }
.banner .by { color: var(--parch-dim); font-variant-numeric: tabular-nums; }
.banner.cible { border-color: var(--parch); box-shadow: 0 0 12px color-mix(in srgb, var(--gold) 60%, transparent); }
.banner.adresse { border-color: var(--bad); padding: 3px 10px; font-weight: 700; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.tip { position: fixed; z-index: 6; pointer-events: none; padding: 6px 10px; border-radius: 3px; font-size: 13px; max-width: 260px; }
.tip b { font-family: var(--f-display); font-size: 13.5px; letter-spacing: .03em; }
.tip div { color: var(--parch-dim); }
.hint { position: fixed; z-index: 3; top: calc(52px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); font-size: 12.5px; color: var(--parch-dim);
  text-shadow: 0 1px 3px var(--ink); white-space: nowrap; }
.erreur { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 16px; }

@media (max-width: 760px) {
  .city { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); width: auto; right: max(16px, env(safe-area-inset-right, 0px)); max-height: 55vh; overflow-y: auto; }
  .city .y { padding: 5px 12px; }
  .legend, .hint, .chip { display: none; }
  .lenses { left: max(16px, env(safe-area-inset-left, 0px)); align-items: center; }
  .vues { justify-content: center; max-width: none; }
  .rlabel { font-size: 10px; letter-spacing: .14em; }
}
@media (max-height: 640px) and (min-width: 761px) { .legend p { display: none; } }
</style>

<body>
<div id="scene"></div>
<div class="vignette"></div>
<div id="labels"></div>

<div class="topbar frame">
  <span class="brand">Atlas électrique</span>
  <span class="sep"></span>
  <span class="res" id="adr">Aucune adresse : lancer essentiel ou carte --adresse</span>
  <span class="chip" id="genere"></span>
</div>
<div class="hint">Glisser pour se déplacer · clic droit pour pivoter · molette pour zoomer · cliquer sur une case</div>

<aside class="city frame" id="city" aria-live="polite"></aside>

<div class="lenses">
  <div class="vues" id="cartes" role="group" aria-label="Carte affichée"></div>
  <div class="legend frame" id="legend"></div>
  <div class="lensbar" role="toolbar" aria-label="Lentilles">
    <button class="lens" data-lens="raccordement" aria-pressed="true"><span class="disc"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#e3b341"/></svg></span>Raccorder</button>
    <button class="lens" data-lens="territoire" aria-pressed="false"><span class="disc"><svg viewBox="0 0 24 24"><path d="M2 20 9 7l4 7 2-3 7 9H2Z" fill="#8b877c"/><path d="m9 7 2 3.6-2-1-2 1L9 7Z" fill="#f1f3f4"/><path d="M18 20v-3" stroke="#6b4f2a" stroke-width="1.6"/><path d="m18 8-3.5 6h2l-2 3h7l-2-3h2L18 8Z" fill="#5f8f3e"/></svg></span>Territoire</button>
  </div>
</div>
<div class="tip frame" id="tip" hidden></div>

<!--__SCRIPTS__-->
<script>
const DATA = /*__DONNEES__*/null;
DATA.adresse = /*__ADRESSE__*/null;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmt = (v, d = 0) => v == null ? "n.d." : Number(v).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
if (!window.THREE) document.body.insertAdjacentHTML("beforeend", '<div class="erreur frame">WebGL ou three.js indisponible : ouvrir la carte dans un navigateur récent.</div>');

const REGION_COLORS = { "11": "#f2cf4a", "24": "#c0663f", "27": "#8e5fc2", "28": "#4a8fd9", "32": "#d94f4f", "44": "#3fb59c", "52": "#58c4e6", "53": "#ece6d2", "75": "#e3892b", "76": "#c73f8a", "84": "#7bc043", "93": "#f08a7a", "94": "#a9a948", "01": "#e8c547", "02": "#e8c547", "03": "#e8c547", "04": "#e8c547", "06": "#e8c547" };
const MEDITERRANEE = new Set(["06", "11", "13", "30", "34", "66", "83", "84", "2A", "2B"]);

const col = h => new THREE.Color(h).convertSRGBToLinear();
const DEP = Object.fromEntries(DATA.departements.map(d => [d.c, d]));
const GR = DATA.grilles, R = DATA.rayonScene, HW = Math.sqrt(3) * R, DZ = 1.5 * R, PS = R / 1.5;
const centre = (g, c, r) => [GR[g].x0 + c * HW + (r & 1) * HW / 2, GR[g].z0 + r * DZ];
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };

// Cases et voisinage
const tiles = [], grid = new Map();
// Mer : [g, c, r] ; pays voisin : [g, c, r, 1] ; case française : 8 valeurs
for (const row of DATA.cases) {
  const [g, c, r, dep, alt, altMax, lat, lon] = row, [x, z] = centre(g, c, r);
  grid.set(g + "," + c + "," + r, tiles.length);
  tiles.push({ g, c, r, x, z, land: row.length === 8, fog: row.length === 4, dep, alt: alt || 0, altMax: altMax || 0, lat, lon });
}
const tileAt = (g, c, r) => { const i = grid.get(g + "," + c + "," + r); return i == null ? null : tiles[i]; };
const nb = (t, k) => { const a = (30 + 60 * k) * Math.PI / 180, x = t.x + HW * Math.sin(a), z = t.z + HW * Math.cos(a);
  const r = Math.round((z - GR[t.g].z0) / DZ); return tileAt(t.g, Math.round((x - GR[t.g].x0 - (r & 1) * HW / 2) / HW), r); };
const land = tiles.filter(t => t.land), fog = tiles.filter(t => t.fog), water = tiles.filter(t => !t.land && !t.fog);
for (const t of land) { const d = DEP[t.dep]; t.reg = d ? d.r : "00"; }
for (const t of tiles) t.dist = t.land || t.fog ? 0 : 99;
let front = land.concat(fog);
for (let step = 1; step < 7 && front.length; step++) { const nx = []; for (const t of front) for (let k = 0; k < 6; k++) { const n = nb(t, k); if (n && n.dist > step) { n.dist = step; nx.push(n); } } front = nx; }

// Relief réel : hauteur selon l'altitude moyenne, exagérée par une racine carrée
const hauteur = alt => .45 + 2.6 * Math.sqrt(Math.max(alt, 0) / 4000);
for (const t of land) {
  const code = GR[t.g].code;
  let base = t.lat > 48.6 ? "#5f8f3e" : t.lon < .5 ? "#6c9a45" : "#74a046";
  if (t.lat < 45.2 && t.lon < 1.5) base = "#8ea24b";
  if (MEDITERRANEE.has(t.dep)) base = "#b0a35f";
  if (code) base = code === "973" ? "#2f6f3a" : "#4f8f45";
  let c = col(base);
  // Collines boisées en vert sombre, roche grise en haute montagne
  if (t.alt > 300) c.lerp(col("#41632f"), Math.min(1, (t.alt - 300) / 600));
  if (t.alt > 1100) c.lerp(col("#8f8c82"), Math.min(.85, (t.alt - 1100) / 700));
  c.offsetHSL(0, 0, (hash(t.c, t.r) - .5) * .06); t.biome = c;
  t.baseH = hauteur(t.alt);
}

// Scène
const host = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = col("#0d1a26"); scene.fog = new THREE.Fog(col("#0d1a26"), 120, 280);
const camera = new THREE.PerspectiveCamera(42, 1, .5, 600);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08; controls.screenSpacePanning = false;
controls.minDistance = 10; controls.maxDistance = 190; controls.minPolarAngle = .3; controls.maxPolarAngle = 1.08;
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };
scene.add(new THREE.HemisphereLight(col("#d7e6ff"), col("#4a3b2a"), .7));
const sun = new THREE.DirectionalLight(col("#ffe4bd"), 1.05); sun.position.set(-45, 90, 35); sun.target.position.set(-45, 0, 0); scene.add(sun.target);
sun.castShadow = true; Object.assign(sun.shadow.camera, { left: -130, right: 130, top: 90, bottom: -90, near: 10, far: 260 });
sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -.0008; scene.add(sun);
const seabed = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ color: col("#16406e"), roughness: .9 }));
seabed.rotation.x = -Math.PI / 2; seabed.position.y = -.05; seabed.receiveShadow = true; scene.add(seabed);
// Soleil et fond marin suivent la carte affichée
const soleil = (x, z) => { sun.position.set(x - 45, 90, z + 35); sun.target.position.set(x, 0, z); seabed.position.x = x; seabed.position.z = z; };
// Métropole et Corse forment une carte, chaque département d'outre-mer la sienne
let carte = 0;
const nomCarte = gi => GR[gi].code ? GR[gi].nom : "Métropole et Corse";

const hexGeo = new THREE.CylinderGeometry(R * .97, R * .97, 1, 6); hexGeo.translate(0, .5, 0);
const dummy = new THREE.Object3D();
const landMesh = new THREE.InstancedMesh(hexGeo, new THREE.MeshStandardMaterial({ roughness: .85, flatShading: true }), land.length);
landMesh.castShadow = landMesh.receiveShadow = true; scene.add(landMesh);
const curH = new Float32Array(land.length), tgtH = new Float32Array(land.length), curC = new Float32Array(land.length * 3), tgtC = new Float32Array(land.length * 3);
land.forEach((t, i) => { t.i = i; curH[i] = tgtH[i] = t.baseH; landMesh.setColorAt(i, t.biome); t.biome.toArray(curC, i * 3); t.biome.toArray(tgtC, i * 3); });
function writeTile(i) { const t = land[i]; dummy.position.set(t.x, 0, t.z); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, curH[i], 1); dummy.updateMatrix(); landMesh.setMatrixAt(i, dummy.matrix); }
land.forEach((_, i) => writeTile(i));
const waterMesh = new THREE.InstancedMesh(hexGeo, new THREE.MeshStandardMaterial({ roughness: .35, metalness: .1, flatShading: true }), water.length);
waterMesh.receiveShadow = true; scene.add(waterMesh);
water.forEach((t, i) => { const d = t.dist, h = d <= 1 ? .26 : d <= 3 ? .18 : .1; dummy.position.set(t.x, 0, t.z); dummy.scale.set(1, h, 1); dummy.updateMatrix(); waterMesh.setMatrixAt(i, dummy.matrix);
  const c = col(d <= 1 ? "#4f9fd6" : d <= 3 ? "#2f78b8" : "#1d5690"); c.offsetHSL(0, 0, (hash(t.r, t.c) - .5) * .03); waterMesh.setColorAt(i, c); });

// Pays voisins en brouillard parchemin, comme les terres inexplorées
const fogMesh = new THREE.InstancedMesh(hexGeo, new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true }), Math.max(fog.length, 1));
fogMesh.count = fog.length; fogMesh.receiveShadow = true; scene.add(fogMesh);
fog.forEach((t, i) => { dummy.position.set(t.x, 0, t.z); dummy.scale.set(1, .42 + hash(t.c, t.r) * .08, 1); dummy.updateMatrix(); fogMesh.setMatrixAt(i, dummy.matrix);
  const c = col("#b8a57a"); c.offsetHSL(0, 0, (hash(t.r, t.c) - .5) * .05); fogMesh.setColorAt(i, c); });

// Montagnes selon l'altitude maximale : le relief pèse sur l'accès et les travaux
const mountains = new THREE.Group(); scene.add(mountains);
function instanced(geo, color, list, group) { const m = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ ...(color && { color: col(color) }), roughness: .8, flatShading: true }), Math.max(list.length, 1));
  m.count = list.length;
  list.forEach((o, i) => { dummy.position.set(o.x, o.y, o.z); dummy.rotation.set(0, o.ry || 0, 0); dummy.scale.set(o.sx, o.sy, o.sx); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); if (o.c) m.setColorAt(i, o.c); });
  m.castShadow = true; group.add(m); return m; }
const coneGeo = new THREE.ConeGeometry(1, 1, 5); coneGeo.translate(0, .5, 0);
const rocks = [], snows = [];
for (const t of land) {
  const top = t.baseH;
  if (t.alt >= 900 || t.altMax >= 2000) { const n = t.altMax >= 2800 ? 2 : 1; for (let j = 0; j < n; j++) {
    const ox = n > 1 ? (j ? .45 : -.4) * PS : 0, oz = n > 1 ? (j ? .3 : -.28) * PS : 0, s = (.6 + hash(t.c + j, t.r) * .2) * PS, H = (.5 + 2 * Math.sqrt(t.altMax / 4800) - j * .35) * PS;
    rocks.push({ x: t.x + ox, y: top, z: t.z + oz, sx: s, sy: H, ry: hash(t.r, j) * 6 });

function legendeElectricite() { const co2 = land.filter(t => t.g === carte).map(t => (DEP[t.dep] || {}).co2).filter(v => v != null);
  const lo = co2.length ? Math.min(...co2) : null, hi = co2.length ? Math.max(...co2) : null;
  const carbone = lo == null ? "n.d." : `${fmt(lo)}${hi > lo ? " à " + fmt(hi) : ""} g/kWh${pillCo2(lo > 100 || hi <= 100 ? hi : null)}`;
  return `<h3>Électricité</h3><div class="filieres"><span>Carbone du réseau</span><span>${carbone}</span><span>Prix moyen HTVA</span><span>${fourchettePrix()}</span></div><p>Carbone en cycle de vie, par région. Prix Eurostat des entreprises${PRIX.length ? " jusqu'à " + esc(PRIX[0].s) : ""}, identique partout (péréquation) : de ${PRIX.length ? fmt(PRIX[0].e, 2) : "n.d."} €/kWh sous 20 MWh par an à ${PRIX.length ? fmt(PRIX[PRIX.length - 1].e, 2) : "n.d."} au-delà de 150 000.</p>`; }
function legendeProduction() { const ps = prodObjs.filter(o => o.t.g === carte).map(o => o.p), tot = {};
  for (const p of ps) tot[p.f] = (tot[p.f] || 0) + p.mw;
  const lignes = Object.entries(tot).sort((a, b) => b[1] - a[1]).map(([f, mw]) => `<span><i style="background:${FILIERES[f] || "#7fe3ff"}"></i>${esc(nomFiliere(f))}</span><span>${fmt(mw)} MW</span>`).join("");
  const seuil = GR[carte].code ? 20 : 200;
  return `<h3>Production</h3>${lignes ? `<div class="filieres">${lignes}</div>` : "<p>Aucun pôle au-dessus du seuil sur cette carte.</p>"}<p>Puissance en service par commune et filière, installations d'au moins 10 MW (registre national, ODRÉ) ; pôles d'au moins ${seuil} MW${GR[carte].code ? "" : " (20 MW en Corse)"}. Taille selon la puissance, le plus gros pôle couvrant les deux tiers de sa case ; un réacteur nucléaire figuré par 1 200 MW environ ; position au centre de la commune.</p>`; }
let lens = "raccordement", animating = true;
function setLens(name) { lens = name; const L = LENS[name];
  land.forEach((t, i) => { const [c, h] = L.tile(t); c.toArray(tgtC, i * 3); tgtH[i] = h; if (REDUCED) { curH[i] = h; c.toArray(curC, i * 3); } });
  mountains.visible = L.show.includes("mountains");
  for (const [k, g] of Object.entries(markers)) g.visible = L.show.includes(k);
  document.querySelectorAll(".lens").forEach(b => b.setAttribute("aria-pressed", b.dataset.lens === name));
  document.getElementById("legend").innerHTML = typeof L.legend === "function" ? L.legend() : L.legend; animating = true; }

// Verdict de l'adresse, ou fiche du département cliqué
const ICON = {
  factory: '<svg viewBox="0 0 24 24"><path d="M3 21V11l5 3v-3l5 3v-3l5 3V4h3v17H3Z" fill="#e3892b"/></svg>',
  pylon: '<svg viewBox="0 0 24 24"><path d="M12 2 7 22h2.2l1-4h3.6l1 4H17L12 2Zm-1.2 13 1.2-5 1.2 5h-2.4ZM5 7h14M6.5 11h11" stroke="#c9d1d6" stroke-width="1.7" fill="none"/></svg>',
  scale: '<svg viewBox="0 0 24 24"><path d="M12 3v17M6 20h12M4 7h16M4 7l-2.5 6h5L4 7Zm16 0-2.5 6h5L20 7Z" stroke="#58c4e6" stroke-width="1.7" fill="none"/></svg>',
  euro: '<svg viewBox="0 0 24 24"><path d="M17.5 6.5A7 7 0 1 0 17.5 17.5M4 10.5h9M4 13.5h9" stroke="#d6b26a" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
  leaf: '<svg viewBox="0 0 24 24"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16Z" fill="#6fbf73"/></svg>',
};
const PILL = { ok: ["good", "ok"], attention: ["warn", "à vérifier"], inconnu: ["neutre", "inconnu"], info: ["neutre", "info"] };
const LIMITE = '<div class="limit"><b>Limite :</b> la capacité de raccordement n\'est pas publique ; seule une étude Enedis ou RTE fait foi.</div>';
const cityEl = document.getElementById("city");
const ficheVide = () => { selBand.set([]); cityEl.style.removeProperty("--rc");
  const ts = land.filter(t => t.g === carte), deps = new Set(ts.map(t => t.dep)).size;
  cityEl.innerHTML = `<header><h2>${esc(nomCarte(carte))}</h2><div class="sub">${ts.length} cases · ${deps} département${deps > 1 ? "s" : ""}</div></header><div class="vide">Cliquez sur une case pour afficher les indicateurs de son département. Changez de carte ou de lentille en bas à droite (touches 1 et 2 pour les lentilles).</div>`; };
function showVerdict() { if (!VERDICT) return ficheVide(); selBand.set([]); cityEl.style.removeProperty("--rc");
  cityEl.innerHTML = `<header><h2>Brancher ici ?</h2><div class="sub">${esc(DATA.adresse.libelle)}</div></header>
  <div class="verdict">${esc(VERDICT.phrase)}</div>
  <div class="yields">${VERDICT.criteres.map(c => { const [cls, mot] = PILL[c.etat] || PILL.info;
    return `<div class="critere"><span class="k">${esc(c.nom)}<span class="pill ${cls}">${mot}</span></span><span class="v">${esc(c.valeur)}</span><span class="d">${esc(c.detail)}</span></div>`; }).join("")}</div>${LIMITE}`; }
function showDep(code) { const d = DEP[code]; if (!d) return;
  const ts = depTiles[code] || [];
  selBand.set(ringOf(ts, .26 * PS, col("#f6d27a")));
  const eqPill = d.tc == null ? "" : d.tc >= 1 ? '<span class="pill good">excédent</span>' : '<span class="pill bad">importe</span>';
  cityEl.style.setProperty("--rc", REGION_COLORS[d.r] || "#d6b26a");
  cityEl.innerHTML = `<header><h2>${esc(d.n)}</h2><div class="sub">${esc(d.c)} · ${esc(d.rn)}</div><button class="close" aria-label="Fermer la fiche">×</button></header>
  <div class="yields">
    <div class="y">${ICON.factory}<span class="k">Conso. industrielle ${d.an || ""}</span><span class="v">${fmt(d.gwh)} GWh <small>${d.rk ? "rang " + d.rk + "/" + d.nc : ""}</small></span></div>
    <div class="y">${ICON.pylon}<span class="k">Postes RTE</span><span class="v">${fmt(d.p)} <small>dont ${fmt(d.p3)} en 400 kV${d.pp ? ", " + d.pp + " en projet" : ""}</small></span></div>
    <div class="y">${ICON.scale}<span class="k">Couverture régionale</span><span class="v">${d.tc == null ? "n.d." : fmt(d.tc * 100) + " %"}${eqPill}</span></div>
    <div class="y">${ICON.leaf}<span class="k">Carbone du réseau</span><span class="v">${fmt(d.co2, 1)} <small>g/kWh</small>${pillCo2(d.co2)}</span></div>
    <div class="y">${ICON.euro}<span class="k">Prix moyen HTVA</span><span class="v">${fourchettePrix()} <small>selon la conso.</small></span></div>
  </div>${LIMITE}`;
  cityEl.querySelector(".close").onclick = VERDICT ? showVerdict : ficheVide; }

// Barre du haut : l'adresse étudiée et la fraîcheur des données
if (DATA.adresse) document.getElementById("adr").textContent = DATA.adresse.libelle;
document.getElementById("genere").textContent = `Généré le ${new Date(DATA.genereLe).toLocaleDateString("fr-FR")} · ${DATA.donnees || "relief IGN, contours Etalab, indicateurs du gold"}`;

// Caméra : une carte à la fois, assez loin des autres pour que le brouillard les cache
let vol = null, bounds = null;
function allerA(x, z, dist, immediat) { const off = new THREE.Vector3(-.05, .75, .66).normalize().multiplyScalar(dist), toT = new THREE.Vector3(x, 0, z), toP = toT.clone().add(off);
  if (immediat) { vol = null; controls.target.copy(toT); camera.position.copy(toP); return; }
  vol = { t0: performance.now(), d: REDUCED ? 1 : 900, fromT: controls.target.clone(), toT, fromP: camera.position.clone(), toP }; }
const moyenne = (ts, k) => ts.reduce((a, t) => a + t[k], 0) / Math.max(1, ts.length);
const boutons = document.getElementById("cartes");
function montrerCarte(gi, immediat) { carte = gi; const ts = tiles.filter(t => t.g === gi), terre = ts.filter(t => t.land);
  bounds = { x0: Math.min(...ts.map(t => t.x)), x1: Math.max(...ts.map(t => t.x)), z0: Math.min(...ts.map(t => t.z)), z1: Math.max(...ts.map(t => t.z)) };
  const cx = moyenne(terre, "x"), cz = moyenne(terre, "z"), etendue = Math.max(bounds.x1 - bounds.x0, bounds.z1 - bounds.z0);
  soleil(cx, cz); allerA(cx, cz + (gi ? 0 : 4), Math.max(30, etendue * 1.2), immediat);
  boutons.querySelectorAll("[data-carte]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.carte === gi));
  if (cityEl.querySelector(".vide")) ficheVide();
  if (lens === "territoire") setLens("territoire"); }
GR.forEach((g, gi) => { if (!tiles.some(t => t.g === gi && t.land)) return; const b = document.createElement("button");
  b.dataset.carte = gi; b.textContent = nomCarte(gi); b.onclick = () => montrerCarte(gi); boutons.appendChild(b); });
const vueAdresse = immediat => { if (carte !== adresseTile.g) montrerCarte(adresseTile.g, true); allerA(adresseTile.x, adresseTile.z, 26, immediat); };
if (adresseTile) { const b = document.createElement("button"); b.textContent = "Adresse"; b.onclick = () => { vueAdresse(); showVerdict(); }; boutons.appendChild(b); }
montrerCarte(adresseTile ? adresseTile.g : 0, true);

// Survol et sélection
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById("tip"); let hovered = -1, down = null;
const lensLine = (t, d) => lens === "raccordement" ? `Raccordement ${avis(t.note)}${t.raisons.length ? " : " + t.raisons.join(", ") : ""}` : !d ? "" : `Électricité ${d.co2 == null ? "n.d." : (d.co2 <= 100 ? "décarbonée" : "carbonée") + " (" + fmt(d.co2) + " g/kWh)"} · couverture régionale ${d.tc == null ? "n.d." : fmt(d.tc * 100) + " %"} · ${fmt(d.gwh)} GWh industriels`;
function pick(e) { const b = renderer.domElement.getBoundingClientRect(); mouse.set((e.clientX - b.left) / b.width * 2 - 1, -(e.clientY - b.top) / b.height * 2 + 1); ray.setFromCamera(mouse, camera); const h = ray.intersectObject(landMesh)[0]; return h ? h.instanceId : -1; }
const pickHub = () => { if (!markers.production.visible) return null; const h = ray.intersectObject(markers.production, true)[0]; return h ? h.object.userData.hub : null; };
renderer.domElement.addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; const i = pick(e);
  if (i !== hovered) { hovered = i; hoverBand.set(i < 0 ? [] : ringOf([land[i]], .16 * PS, col("#ffffff"))); renderer.domElement.style.cursor = i < 0 ? "" : "pointer"; }
  const hub = pickHub();
  if (hub) { tip.innerHTML = `<b>${esc(hub.n)}</b><div>${esc(nomFiliere(hub.f))} · ${fmt(hub.mw)} MW en service</div><div>${hub.gwh ? fmt(hub.gwh) + " GWh produits sur 12 mois · " : ""}${hub.ni} installation${hub.ni > 1 ? "s" : ""}</div>`; tip.hidden = false;
    tip.style.left = Math.min(innerWidth - 270, e.clientX + 16) + "px"; tip.style.top = (e.clientY + 18) + "px"; return; }
  if (i < 0) { tip.hidden = true; return; } const t = land[i], d = DEP[t.dep];
  tip.innerHTML = `<b>${esc(d ? d.n : t.dep)} (${esc(t.dep)})</b><div>${esc(lensLine(t, d))}</div><div>Altitude moyenne ${fmt(t.alt)} m</div>`; tip.hidden = false;
  tip.style.left = Math.min(innerWidth - 270, e.clientX + 16) + "px"; tip.style.top = (e.clientY + 18) + "px"; });
renderer.domElement.addEventListener("pointerleave", () => { tip.hidden = true; hovered = -1; hoverBand.set([]); });
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; vol = null; });
renderer.domElement.addEventListener("pointerup", e => { if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6 || e.button !== 0) return; const i = pick(e); if (i >= 0) showDep(land[i].dep); });
document.querySelectorAll(".lens").forEach(b => b.onclick = () => setLens(b.dataset.lens));
addEventListener("keydown", e => { const k = { "1": "raccordement", "2": "territoire" }[e.key]; if (k) setLens(k); });

// Boucle de rendu
const v3 = new THREE.Vector3(), tmpC = new THREE.Color();
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
function tick(ms) {
  const t = ms / 1000;
  if (animating) { let moving = false;
    for (let i = 0; i < land.length; i++) { const dh = tgtH[i] - curH[i]; if (Math.abs(dh) > .003) { curH[i] += dh * .12; moving = true; } else curH[i] = tgtH[i];
      for (let j = 0; j < 3; j++) { const q = i * 3 + j, dc = tgtC[q] - curC[q]; if (Math.abs(dc) > .002) { curC[q] += dc * .14; moving = true; } else curC[q] = tgtC[q]; }
      writeTile(i); tmpC.fromArray(curC, i * 3); landMesh.setColorAt(i, tmpC); }
    landMesh.instanceMatrix.needsUpdate = true; landMesh.instanceColor.needsUpdate = true;
    [regionBand, depBand, selBand, hoverBand].forEach(b => b.update()); animating = moving; }
  for (const g of followers) { const u = g.userData; g.position.y = curH[u.i] + (u.dy || 0);
    if (u.gem && !REDUCED) { u.gem.rotation.y = t * 1.2 + u.ph; u.gem.position.y = (1.3 + Math.sin(t * 2 + u.ph) * .12) * PS; }
    if (u.rotor && !REDUCED) u.rotor.rotation.z = t * 1.6 + u.ph;
    if (u.ring && !REDUCED) { const s = 1 + ((t * .6) % 1) * .35; g.scale.set(s, s, s); g.material.opacity = .85 * (1 - (t * .6) % 1); } }
  if (vol) { const k = Math.min(1, (ms - vol.t0) / vol.d), e = k * k * (3 - 2 * k);
    controls.target.lerpVectors(vol.fromT, vol.toT, e); camera.position.lerpVectors(vol.fromP, vol.toP, e); if (k >= 1) vol = null; }
  const tg = controls.target; tg.x = Math.max(bounds.x0, Math.min(bounds.x1, tg.x)); tg.z = Math.max(bounds.z0, Math.min(bounds.z1, tg.z));
  controls.update(); renderer.render(scene, camera);
  for (const L of labels) { if (L.g !== carte || !L.lenses.includes(lens)) { L.el.hidden = true; continue; }
    v3.set(L.x, (L.i != null ? curH[L.i] : 1) + L.y, L.z).project(camera);
    if (v3.z > 1 || Math.abs(v3.x) > 1.1 || Math.abs(v3.y) > 1.1) { L.el.hidden = true; continue; }
    L.el.hidden = false; L.el.style.left = (v3.x + 1) / 2 * innerWidth + "px"; L.el.style.top = (1 - v3.y) / 2 * innerHeight + "px"; }
  requestAnimationFrame(tick);
}
setLens("raccordement");
if (VERDICT) showVerdict(); else if (DATA.adresse && DEP[DATA.adresse.departement]) showDep(DATA.adresse.departement); else ficheVide();
if (adresseTile) vueAdresse(true);
requestAnimationFrame(tick);
</script>
</body>
</html>
