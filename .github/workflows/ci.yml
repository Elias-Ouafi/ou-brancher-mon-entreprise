name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jeton GitHub en lecture seule : la CI ne publie rien
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.22"

jobs:
  lint-test:
    # Le nom Ubuntu reste celui exigé par la protection de main ; Windows est le poste de
    # développement : console cp1252 et chemins y piègent ce qu'Ubuntu laisse passer
    name: ruff + pytest + dbt build${{ matrix.os == 'windows-latest' && ' (Windows)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions figées sur un commit : un tag déplacé ne peut pas injecter de code
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # PySpark (ingestion) tourne sur la JVM
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        run: pip install "uv==${{ env.UV_VERSION }}"

      # dbt et report activent les tests de bout en bout
      - name: Install dependencies
        run: uv sync --group dev --group dbt --group report --group e2e

      # Navigateur des parcours de l'application (test_navigateur.py)
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Sans reseau ni secret : API simulees, base DuckDB synthetique
      - name: Tests
        run: uv run pytest --cov
