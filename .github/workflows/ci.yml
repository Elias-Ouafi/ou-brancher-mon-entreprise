name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-test:
    name: ruff + pytest + dbt build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # uv installe via pip : aucune action tierce, aucun credential.
      - name: Install uv
        run: pip install uv

      # Les groupes dbt et report activent les tests de bout en bout des
      # couches silver et gold et du rapport PDF, ignores sinon.
      - name: Install dependencies
        run: uv sync --group dev --group dbt --group report

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Les appels HTTP sont simules par pytest-httpx : le runner n'atteint
      # jamais l'API ODRE, et aucun secret n'est necessaire. dbt build tourne
      # sur une base DuckDB temporaire alimentee par des donnees synthetiques.
      - name: Tests
        run: uv run pytest
